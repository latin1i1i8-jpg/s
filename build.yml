name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.9
        run: |
          mkdir -p /tmp/gradle-tools
          cd /tmp/gradle-tools
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "/tmp/gradle-tools/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Check Gradle
        run: gradle --version

      - name: Build with Gradle
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ github.workspace }}

      - name: List APK files
        if: always()
        run: find . -name "*.apk" -type f

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
