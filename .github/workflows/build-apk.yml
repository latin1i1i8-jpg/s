name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 권한 설정
        run: chmod +x gradlew

      - name: 디버그 APK 빌드
        run: ./gradlew assembleDebug

      - name: APK 목록 확인
        run: ls -lah app/build/outputs/apk/debug/

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Build 실패 시 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            build/
