name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Download and setup Gradle 8.9
        run: |
          cd $HOME
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          rm gradle-8.9-bin.zip
          echo "GRADLE_HOME=$HOME/gradle-8.9" >> $GITHUB_ENV
          echo "$HOME/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Verify Gradle installation
        run: gradle --version

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/.gradle

      - name: Check for APK file
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK 빌드 성공!"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK를 찾을 수 없습니다"
            find app/build -name "*.apk" 2>/dev/null || echo "APK 파일 없음"
            exit 1
          fi

      - name: Upload APK to Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            app/build/outputs/
          retention-days: 7
