name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설치 (Gradle Wrapper 없이)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          export PATH=$PWD/gradle-8.9/bin:$PATH
          gradle --version

      - name: 디버그 APK 빌드
        run: |
          export PATH=$PWD/gradle-8.9/bin:$PATH
          gradle assembleDebug --no-daemon

      - name: APK 목록 확인
        run: ls -lah app/build/outputs/apk/debug/

      - name: APK 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: 빌드 실패 시 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            app/build/outputs/
